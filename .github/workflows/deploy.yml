name: Build and Deploy to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Robot lấy code mới nhất của bạn về máy chủ của GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Đăng nhập vào Docker Hub bằng chìa khóa (Secrets) bạn đã tạo
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Bước 3: Cài đặt công cụ Buildx (Chuẩn mới nhất của Docker giúp build nhanh và mượt hơn)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 4: Ra lệnh Build image từ Dockerfile và đẩy (Push) thẳng lên Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Gắn 2 cái tag: 1 cái là latest, 1 cái là mã commit để dễ quản lý phiên bản
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/portfolio-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/portfolio-backend:${{ github.sha }}

      - name: Triển khai lên DevOps Classroom
        run: |
          REPO="ntqnhu0105/portfolio-backend"
          CONTAINER_PORT=80
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${{ secrets.DEPLOY_URL }}?repo=$REPO&tag=latest&slot=3&container_port=$CONTAINER_PORT&strict_container_port=0")
          BODY=$(echo "$RESPONSE" | sed "$d")
          CODE=$(echo "$RESPONSE" | tail -n1)
          echo "Webhook HTTP: $CODE"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "Deploy thất bại. Xem chi tiết trong nhóm log bên dưới."
            echo "::group::Chi tiết webhook JSON"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
            echo "::endgroup::"
            exit 1
          fi
          echo "Deploy thành công."
          echo "::group::Chi tiết webhook JSON"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          echo "::endgroup::"
